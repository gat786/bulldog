on:
  push:
    tags:
      - v*

name: Release Bulldog Artifact

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v6
        with:
          # Version or version range of Go to use
          go-version: "1.26"

      - name: Build All Platforms
        working-directory: app/
        run: |
          # Define targets as "GOOS/GOARCH/LABEL"
          TARGETS=(
            "linux/amd64/linux-amd64"
            "linux/arm64/linux-arm64"
            "linux/amd64/debian-amd64"
            "windows/386/windows-x86"
            "windows/arm64/windows-arm64"
          )

          mkdir -p dist

          for target in "${TARGETS[@]}"; do
            # Split the string into variables
            IFS="/" read -r GOOS GOARCH LABEL <<< "$target"

            # Determine extension
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

            OUTPUT="dist/bulldog-${LABEL}${EXT}"

            echo "Building for $LABEL ($GOOS/$GOARCH)..."

            # Execute build with inline env variables
            GOOS=$GOOS GOARCH=$GOARCH go build -o "$OUTPUT" .
          done

      - name: gh packages upload
        id: gh-upload
        working-directory: app/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*
